name: ares

services:
  storage:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ares-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ares-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ares-storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://storage:9000 $${MINIO_ROOT_USER:-ares-local} $${MINIO_ROOT_PASSWORD:-ares-local-secret} && mc mb --ignore-existing local/ares-quarantine && mc mb --ignore-existing local/ares-available && mc anonymous set none local/ares-quarantine && mc anonymous set none local/ares-available"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ares-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ares-local-secret}
    restart: "no"

  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\0' | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "8025:8025"
    restart: unless-stopped

  database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ares_dev
      MARIADB_USER: ares_app
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-ares-local-password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ares-local-root-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ares-database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: mysql://ares_app:${MARIADB_PASSWORD:-ares-local-password}@database:3306/ares_dev
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://ares_app:${MARIADB_PASSWORD:-ares-local-password}@database:3306/ares_dev
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4321}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Mexico_City}
      ATTENDANCE_ALERT_HOURS: ${ATTENDANCE_ALERT_HOURS:-12}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env before starting the backend}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ares-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ares-local-secret}
      S3_FORCE_PATH_STYLE: "true"
      S3_QUARANTINE_BUCKET: ares-quarantine
      S3_AVAILABLE_BUCKET: ares-available
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      STORAGE_SCANNER_ENABLED: "true"
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-development-only-mfa-key-change-me-32chars}
      OUTBOX_ENCRYPTION_KEY: ${OUTBOX_ENCRYPTION_KEY:-development-only-outbox-key-change-me-32chars}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@ares.local}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_PROXY_TARGET: http://backend:3000
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 4321
    ports:
      - "4321:4321"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  ares-database:
  ares-storage:
